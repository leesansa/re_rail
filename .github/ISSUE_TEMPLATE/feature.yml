name: 기능 작업
description: 새 기능이나 화면 작업을 제안합니다.
title: "[기능] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자에게 필요한 결과를 설명해 주세요.
      placeholder: 어떤 기능이 왜 필요한가요?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 완료 여부를 확인할 수 있는 항목을 적어 주세요.
      placeholder: 화면과 동작의 확인 기준
    validations:
      required: true

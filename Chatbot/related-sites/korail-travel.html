<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="코레일 리디자인 과제용 코레일관광개발 시안 페이지입니다." />
    <title>코레일관광개발 | 리디자인 시안</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <!-- 01. 헤더: 로고 + 사이트 이름 + 챗봇으로 돌아가기 -->
    <header class="site-header">
      <div class="brand">
        <img class="brand-logo" src="korail-logo.png" alt="KORAIL" />
        <h1 class="site-name">코레일관광개발<small>리디자인 시안</small></h1>
      </div>
      <a class="back-link" href="../index.html">
        <span>챗봇으로 돌아가기</span>
        <span class="back-icon" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M9 1.5v9L2 6z" /></svg></span>
      </a>
    </header>

    <!-- 02. 대표 영역 -->
    <section class="hero">
      <h2>기차로 떠나는 특별한 여행</h2>
      <p>관광열차와 테마 기차여행 상품, 열차 내 서비스 등 기차여행과 관련된 정보를 안내합니다.</p>
    </section>

    <!-- 03. 주요 메뉴: 카드를 누르면 아래에 상세 안내 표시 (site.js) -->
    <main class="content">
      <h3>주요 메뉴</h3>
      <ul class="card-grid">
          <li>
            <button class="card" type="button" data-title="관광열차" data-detail="지역의 풍경과 문화를 즐길 수 있는 관광열차 상품을 안내합니다.">
              <strong>관광열차</strong>
              <span>테마가 있는 열차</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="기차여행 상품" data-detail="기차와 관광지를 묶은 당일 여행, 숙박 여행 상품을 안내합니다.">
              <strong>기차여행 상품</strong>
              <span>당일·숙박 여행</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="열차 내 서비스" data-detail="열차 안에서 제공되는 승무 서비스를 소개합니다.">
              <strong>열차 내 서비스</strong>
              <span>승무 서비스</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="여행 문의" data-detail="여행 상품 예약 방법과 상담 안내를 제공합니다.">
              <strong>여행 문의</strong>
              <span>예약과 상담</span>
            </button>
          </li>
      </ul>
      <div class="detail" id="detail" aria-live="polite" hidden></div>
    </main>

    <!-- 04. 푸터 -->
    <footer class="site-footer">
      <p class="notice">※ 이 페이지는 코레일 리디자인 과제용 시안이며, 실제 코레일관광개발 사이트가 아닙니다.</p>
      <p>COPYRIGHT(C) KOREA RAILROAD. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="site.js"></script>
  </body>
</html>

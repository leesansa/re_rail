<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="코레일 리디자인 과제용 코레일 홈페이지 시안 페이지입니다." />
    <title>코레일 홈페이지 | 리디자인 시안</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <!-- 01. 헤더: 로고 + 사이트 이름 + 챗봇으로 돌아가기 -->
    <header class="site-header">
      <div class="brand">
        <img class="brand-logo" src="korail-logo.png" alt="KORAIL" />
        <h1 class="site-name">코레일 홈페이지<small>리디자인 시안</small></h1>
      </div>
      <a class="back-link" href="../index.html">
        <span>챗봇으로 돌아가기</span>
        <span class="back-icon" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M9 1.5v9L2 6z" /></svg></span>
      </a>
    </header>

    <!-- 02. 대표 영역 -->
    <section class="hero">
      <h2>기차 여행의 시작, 코레일</h2>
      <p>승차권 예매부터 열차 운행 정보, 기차여행 상품, 고객 서비스까지 열차 이용에 필요한 정보를 한곳에서 안내합니다.</p>
    </section>

    <!-- 03. 주요 메뉴: 카드를 누르면 아래에 상세 안내 표시 (site.js) -->
    <main class="content">
      <h3>주요 메뉴</h3>
      <ul class="card-grid">
          <li>
            <button class="card" type="button" data-title="승차권 예매" data-detail="출발역·도착역·날짜를 선택해 열차를 조회하고 승차권을 예매할 수 있습니다.
예매한 승차권은 승차권 확인 메뉴에서 볼 수 있습니다.">
              <strong>승차권 예매</strong>
              <span>열차 조회와 예매</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="열차 운행 정보" data-detail="열차 시간표와 운행 중인 열차의 지연 정보를 확인할 수 있습니다.">
              <strong>열차 운행 정보</strong>
              <span>시간표와 지연 정보</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="기차여행" data-detail="관광열차와 테마 여행 등 기차로 떠나는 여행 상품을 안내합니다.">
              <strong>기차여행</strong>
              <span>여행 상품 안내</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="고객센터" data-detail="자주 찾는 질문, 고객의 소리, 유실물 안내를 이용할 수 있습니다.
철도고객센터: 1588-7788">
              <strong>고객센터</strong>
              <span>문의와 유실물</span>
            </button>
          </li>
      </ul>
      <div class="detail" id="detail" aria-live="polite" hidden></div>
    </main>

    <!-- 04. 푸터 -->
    <footer class="site-footer">
      <p class="notice">※ 이 페이지는 코레일 리디자인 과제용 시안이며, 실제 코레일 홈페이지 사이트가 아닙니다.</p>
      <p>COPYRIGHT(C) KOREA RAILROAD. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="site.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="코레일 리디자인 과제용 한국철도공사 시안 페이지입니다." />
    <title>한국철도공사 | 리디자인 시안</title>
    <link rel="stylesheet" href="site.css" />
  </head>
  <body>
    <!-- 01. 헤더: 로고 + 사이트 이름 + 챗봇으로 돌아가기 -->
    <header class="site-header">
      <div class="brand">
        <img class="brand-logo" src="korail-logo.png" alt="KORAIL" />
        <h1 class="site-name">한국철도공사<small>리디자인 시안</small></h1>
      </div>
      <a class="back-link" href="../index.html">
        <span>챗봇으로 돌아가기</span>
        <span class="back-icon" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M9 1.5v9L2 6z" /></svg></span>
      </a>
    </header>

    <!-- 02. 대표 영역 -->
    <section class="hero">
      <h2>국민과 함께 달리는 한국철도</h2>
      <p>한국철도공사의 소개와 경영 정보, 사회공헌 활동, 채용 소식 등 공사에 관한 정보를 안내합니다.</p>
    </section>

    <!-- 03. 주요 메뉴: 카드를 누르면 아래에 상세 안내 표시 (site.js) -->
    <main class="content">
      <h3>주요 메뉴</h3>
      <ul class="card-grid">
          <li>
            <button class="card" type="button" data-title="공사 소개" data-detail="한국철도공사의 비전, 연혁, 조직 등을 소개합니다.">
              <strong>공사 소개</strong>
              <span>비전과 연혁</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="경영 공시" data-detail="경영 실적과 공시 자료 등 경영 정보를 공개합니다.">
              <strong>경영 공시</strong>
              <span>투명한 경영 정보</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="사회공헌" data-detail="지역사회와 함께하는 다양한 사회공헌 활동을 소개합니다.">
              <strong>사회공헌</strong>
              <span>함께하는 철도</span>
            </button>
          </li>
          <li>
            <button class="card" type="button" data-title="채용 정보" data-detail="채용 공고와 채용 절차를 안내합니다.">
              <strong>채용 정보</strong>
              <span>인재 채용</span>
            </button>
          </li>
      </ul>
      <div class="detail" id="detail" aria-live="polite" hidden></div>
    </main>

    <!-- 04. 푸터 -->
    <footer class="site-footer">
      <p class="notice">※ 이 페이지는 코레일 리디자인 과제용 시안이며, 실제 한국철도공사 사이트가 아닙니다.</p>
      <p>COPYRIGHT(C) KOREA RAILROAD. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="site.js"></script>
  </body>
</html>

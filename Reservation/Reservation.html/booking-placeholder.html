<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>예약 | KORAIL</title>
    <link rel="stylesheet" href="../Reservation.css" />
  </head>
  <body>
    <!-- 임시 예약 페이지: 실제 예약 페이지가 완성되면 이 파일을 교체 -->
    <header class="site-header">
      <img
        class="brand-logo"
        src="../../assets/korail-logo.svg"
        alt="KORAIL"
        width="152"
        height="37"
      />
    </header>
    <main>
      <section class="page-heading"><h1>승차권 예약</h1></section>
      <div class="booking-placeholder-content">
        <p>예약 페이지를 준비 중입니다.</p>
        <p id="booking-selection"></p>
        <a href="Reservation.html">열차 목록으로 돌아가기</a>
      </div>
    </main>
    <script>
      // 임시 페이지에서 선택한 열차와 좌석을 표시한다. 실제 예약 화면 연결 시 교체.
      const selection = new URLSearchParams(window.location.search);
      const details = [
        selection.get("date"),
        selection.get("train"),
        selection.get("departure") && selection.get("arrival")
          ? `${selection.get("departure")} → ${selection.get("arrival")}`
          : null,
        selection.get("seat"),
        selection.get("price"),
        selection.get("passengers") && `${selection.get("passengers")}명`,
      ].filter(Boolean);
      document.querySelector("#booking-selection").textContent =
        details.join(" · ");
    </script>
  </body>
</html>

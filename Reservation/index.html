<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="코레일_리디자인 Figma 원본을 구현한 승차권 예매 화면 시안입니다."
    />
    <title>승차권 예매 | KORAIL</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 01. 헤더-->
    <header class="site-header">
      <img
        class="brand-logo"
        src="assets/korail-logo.svg"
        alt="KORAIL"
        width="152"
        height="37"
      />
      <nav class="utility-nav" aria-label="회원 메뉴">
        <!-- 임시 링크: 로그인 페이지 제작 전까지 클릭해도 이동하지 않음 -->
        <a class="utility-item utility-placeholder-link" href="login.html">
          <img src="assets/login.png" alt="" width="27" height="27" />
          <span>로그인</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <!-- 임시 링크: 장바구니 페이지 제작 전까지 클릭해도 이동하지 않음 -->
        <a class="utility-item utility-placeholder-link" href="cart.html">
          <img src="assets/cart.png" alt="" width="27" height="27" />
          <span>장바구니</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <!-- 임시 링크: 마이페이지 제작 전까지 클릭해도 이동하지 않음 -->
        <a class="utility-item utility-placeholder-link" href="mypage.html">
          <img src="assets/mypage.png" alt="" width="31" height="31" />
          <span>마이페이지</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <!-- 언어 선택 메뉴: 선택한 언어를 버튼에 표시 -->
        <div class="utility-language-control">
          <button
            class="utility-item utility-language"
            type="button"
            aria-label="언어 선택, 현재 한국어"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="language-menu"
          >
            <img src="assets/language.png" alt="" width="37" height="37" />
            <span>Langueage</span>
          </button>
          <div id="language-menu" class="utility-language-menu" role="group" aria-label="언어 목록" hidden>
            <button type="button" aria-pressed="true">한국어</button>
            <button type="button" aria-pressed="false">English</button>
            <button type="button" aria-pressed="false">中文</button>
            <button type="button" aria-pressed="false">日本語</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- 02. 페이지 제목 -->
      <section class="page-heading" aria-labelledby="page-title">
        <h1 id="page-title">승차권 예매</h1>
      </section>

      <div class="reservation-content">
        <!-- 03. 날짜 및 시간 -->
        <section class="date-navigation" aria-label="선택한 출발 날짜와 시간">
          <!-- 이전 날짜 화살표 -->
          <button
            class="date-button previous-date"
            type="button"
            aria-label="이전 날짜"
          >
            <span class="previous-icon"
              ><img src="assets/아이콘_예매상새2.svg" alt=""
            /></span>
          </button>
          <time class="selected-date" datetime="2026-10-21T00:00:00+09:00"
            >2026-10-21-(수) 00:00</time
          >
          <!-- 달력 아이콘 -->
          <button
            class="date-button calendar-button"
            type="button"
            aria-label="달력"
          >
            <span class="calendar-icon"
              ><img src="assets/아이콘_코레일13.svg" alt=""
            /></span>
          </button>
          <!-- 다음 날짜 화살표 -->
          <button
            class="date-button next-date"
            type="button"
            aria-label="다음 날짜"
          >
            <span class="next-icon"
              ><img src="assets/아이콘_예매상새1.svg" alt=""
            /></span>
          </button>
        </section>

        <!-- 04. 여정 선택-->
        <section class="route-selection" aria-label="선택한 여정">
          <!-- 출발역 -->
          <button
            class="station-field departure-field"
            type="button"
            aria-label="출발역 서울"
          >
            <img
              class="departure-icon"
              src="assets/아이콘_코레일14.svg"
              alt=""
            />
            <span>서울</span>
          </button>
          <!-- 출발역과 도착역 교환 -->
          <button
            class="swap-button"
            type="button"
            aria-label="출발역과 도착역 교환"
          >
            <img src="assets/아이콘_코레일15.svg" alt="" />
          </button>
          <!-- 도착역 -->
          <button
            class="station-field arrival-field"
            type="button"
            aria-label="도착역 부산"
          >
            <img class="arrival-icon" src="assets/아이콘_코레일16.svg" alt="" />
            <span>부산</span>
          </button>
          <!-- 탑승 인원: 버튼을 누르면 숫자를 직접 입력하는 팝업을 표시 -->
          <button
            class="passenger-field"
            type="button"
            aria-label="탑승 인원 총 1명"
          >
            <img src="assets/passenger.png" alt="" width="18" height="22" />
            <span>총 1명</span>
          </button>
        </section>

        <!-- 05. 조회 조건: 좌석 등급, 직통 여부, 열차 종류 -->
        <section class="filter-bar" aria-label="열차 조회 조건">
          <!-- 좌석 등급 드롭다운: 일반석 / 우등실 / 특실 -->
          <div class="filter-control">
            <button
              class="filter-chip"
              type="button"
              aria-label="좌석 등급 일반석"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="seat-filter-menu"
            >
              <span>일반석</span
              ><img
                class="filter-chevron"
                src="assets/filter-chevron.svg"
                alt=""
              />
            </button>
            <div
              id="seat-filter-menu"
              class="filter-menu"
              role="group"
              aria-label="좌석 등급 선택"
              hidden
            >
              <button type="button" aria-pressed="true">일반석</button>
              <button type="button" aria-pressed="false">우등실</button>
              <button type="button" aria-pressed="false">특실</button>
            </div>
          </div>
          <!-- 직통 여부 드롭다운: 직통 / 경유 / 환승 -->
          <div class="filter-control">
            <button
              class="filter-chip"
              type="button"
              aria-label="직통 여부 직통"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="route-filter-menu"
            >
              <span>직통</span
              ><img
                class="filter-chevron"
                src="assets/filter-chevron.svg"
                alt=""
              />
            </button>
            <div
              id="route-filter-menu"
              class="filter-menu"
              role="group"
              aria-label="운행 방식 선택"
              hidden
            >
              <button type="button" aria-pressed="true">직통</button>
              <button type="button" aria-pressed="false">경유</button>
              <button type="button" aria-pressed="false">환승</button>
            </div>
          </div>
          <!-- 열차 종류 드롭다운: 전체는 글자, 나머지는 17~20번 기본 로고 이미지 -->
          <div class="filter-control filter-control-train">
            <button
              class="filter-chip filter-chip-short"
              type="button"
              aria-label="열차 종류 전체"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="train-filter-menu"
            >
              <span>전체</span>
              <img
                class="filter-selected-icon"
                src="../assets/아이콘/아이콘_코레일21.png"
                alt=""
                hidden
              />
              <img
                class="filter-chevron"
                src="assets/filter-chevron.svg"
                alt=""
              />
            </button>
            <!-- 선택 시 같은 열차의 21~24번 컬러 로고로 교체 -->
            <div
              id="train-filter-menu"
              class="filter-menu filter-menu-train"
              role="group"
              aria-label="열차 종류 선택"
              hidden
            >
              <button type="button" data-value="전체" aria-pressed="true">
                전체
              </button>
              <button
                type="button"
                data-value="KTX"
                data-icon="../assets/아이콘/아이콘_코레일17.png"
                data-selected-icon="../assets/아이콘/아이콘_코레일21.png"
                aria-label="KTX"
                aria-pressed="false"
              >
                <img src="../assets/아이콘/아이콘_코레일17.png" alt="" />
              </button>
              <button
                type="button"
                data-value="ITX 새마을"
                data-icon="../assets/아이콘/아이콘_코레일18.png"
                data-selected-icon="../assets/아이콘/아이콘_코레일22.png"
                aria-label="ITX 새마을"
                aria-pressed="false"
              >
                <img src="../assets/아이콘/아이콘_코레일18.png" alt="" />
              </button>
              <button
                type="button"
                data-value="무궁화"
                data-icon="../assets/아이콘/아이콘_코레일19.png"
                data-selected-icon="../assets/아이콘/아이콘_코레일24.png"
                aria-label="무궁화"
                aria-pressed="false"
              >
                <img src="../assets/아이콘/아이콘_코레일19.png" alt="" />
              </button>
              <button
                type="button"
                data-value="KTX 산천"
                data-icon="../assets/아이콘/아이콘_코레일20.png"
                data-selected-icon="../assets/아이콘/아이콘_코레일23.png"
                aria-label="KTX 산천"
                aria-pressed="false"
              >
                <img src="../assets/아이콘/아이콘_코레일20.png" alt="" />
              </button>
            </div>
          </div>
        </section>

        <!-- 06. 열차 목록 -->
        <section
          class="train-results"
          aria-label="서울에서 부산으로 가는 열차 목록"
        >
          <!-- 열차 카드는 train-data.js 배열에서 생성 -->
          <ol class="train-list"></ol>
          <p class="train-empty" role="status" hidden>조건에 맞는 열차가 없습니다.</p>
          <p class="train-loading" role="status" aria-live="polite" hidden>
            열차 정보를 불러오는 중...
          </p>
          <div class="train-load-trigger" aria-hidden="true"></div>
        </section>
      </div>
    </main>
    <!-- 달력 화면 임시 팝업: 실제 달력 페이지가 완성되면 내용을 교체 -->
    <dialog
      id="calendar-dialog"
      class="calendar-dialog"
      aria-labelledby="calendar-dialog-title"
    >
      <div class="calendar-dialog-header">
        <h2 id="calendar-dialog-title">날짜 선택</h2>
        <form method="dialog">
          <button
            type="submit"
            class="calendar-dialog-close"
            aria-label="달력 닫기"
          >
            ×
          </button>
        </form>
      </div>
      <p>달력 페이지를 준비 중입니다.</p>
    </dialog>
    <!-- 역 선택 임시 팝업: 실제 역 선택 화면이 완성되면 이 내용을 교체 -->
    <dialog
      id="route-dialog"
      class="calendar-dialog"
      aria-labelledby="route-dialog-title"
    >
      <div class="calendar-dialog-header">
        <h2 id="route-dialog-title">선택 화면</h2>
        <form method="dialog">
          <button
            type="submit"
            class="calendar-dialog-close"
            aria-label="팝업 닫기"
          >
            ×
          </button>
        </form>
      </div>
      <p id="route-dialog-message">선택 화면을 준비 중입니다.</p>
    </dialog>
    <!-- 탑승 인원 입력 팝업: 적용 버튼으로 입력한 숫자를 여정에 반영 -->
    <dialog
      id="passenger-dialog"
      class="calendar-dialog"
      aria-labelledby="passenger-dialog-title"
    >
      <div class="calendar-dialog-header">
        <h2 id="passenger-dialog-title">탑승 인원 선택</h2>
        <form method="dialog">
          <button
            type="submit"
            class="calendar-dialog-close"
            aria-label="탑승 인원 팝업 닫기"
          >
            ×
          </button>
        </form>
      </div>
      <form id="passenger-form" class="passenger-form">
        <label for="passenger-count">탑승 인원</label>
        <input
          id="passenger-count"
          name="passengers"
          type="number"
          min="1"
          step="1"
          value="1"
          required
        />
        <button type="submit">적용</button>
      </form>
    </dialog>
    <!-- 열차 데이터 배열을 먼저 로드한 뒤 카드 렌더링·필터 스크립트를 실행 -->
    <script src="train-data.js" defer></script>
    <script src="train-results.js" defer></script>
  </body>
</html>

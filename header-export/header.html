<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KORAIL 헤더</title>
    <link rel="stylesheet" href="header.css" />
    <script src="header.js" defer></script>
  </head>
  <body>
    <!-- 예약 화면에서 분리한 헤더 영역 -->
    <header class="site-header">
      <img class="brand-logo" src="assets/korail-logo.svg" alt="KORAIL" width="152" height="37" />
      <nav class="utility-nav" aria-label="회원 메뉴">
        <!-- 실제 페이지가 준비되면 href를 연결하고 header.js의 임시 차단을 제거 -->
        <a class="utility-item utility-placeholder-link" href="login.html">
          <img src="assets/login.png" alt="" width="27" height="27" />
          <span>로그인</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <a class="utility-item utility-placeholder-link" href="cart.html">
          <img src="assets/cart.png" alt="" width="27" height="27" />
          <span>장바구니</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <a class="utility-item utility-placeholder-link" href="mypage.html">
          <img src="assets/mypage.png" alt="" width="31" height="31" />
          <span>마이페이지</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <div class="utility-language-control">
          <button class="utility-item utility-language" type="button"
            aria-label="언어 선택, 현재 한국어" aria-haspopup="true"
            aria-expanded="false" aria-controls="language-menu">
            <img src="assets/language.png" alt="" width="37" height="37" />
            <span>Langueage</span>
          </button>
          <!-- 번역 기능이 연결되기 전까지 선택한 언어만 헤더에 표시 -->
          <div id="language-menu" class="utility-language-menu" role="group" aria-label="언어 목록" hidden>
            <button type="button" aria-pressed="true">한국어</button>
            <button type="button" aria-pressed="false">English</button>
            <button type="button" aria-pressed="false">中文</button>
            <button type="button" aria-pressed="false">日本語</button>
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>

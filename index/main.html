<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코레일 예매사이트</title>
    <!-- reset css 적용 후 코드 작성해야 할 것 같아서, reset.css 파일 꼭 같이 가져가셔서 코딩 시작해주세요!
        + 건영 님이 헤더 부분 필요하셔서 만들어 두셨습니다! header.html / css / js 파일 참고해주세요! -->
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./main.css" />
    <script src="../header-export/header.js" defer></script>
    <link rel="icon" type="image/png" href="../assets/아이콘/코레일_파비콘.png" />
  </head>
  <body>
    <!-- 공간 확인용 글자는 나중에 이미지나 버튼으로 바꾸세요. -->
    <header class="site-header">
      <img class="brand-logo" src="../header-export/assets/korail-logo.svg" alt="KORAIL" width="152" height="37" />
      <nav class="utility-nav" aria-label="회원 메뉴">
        <!-- 실제 페이지가 준비되면 href를 연결하고 header.js의 임시 차단을 제거 -->
        <a class="utility-item utility-placeholder-link" href="login.html">
          <img src="../header-export/assets/login.png" alt="" width="27" height="27" />
          <span>로그인</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <a class="utility-item utility-placeholder-link" href="cart.html">
          <img src="../header-export/assets/cart.png" alt="" width="27" height="27" />
          <span>장바구니</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <a class="utility-item utility-placeholder-link" href="mypage.html">
          <img src="../header-export/assets/mypage.png" alt="" width="31" height="31" />
          <span>마이페이지</span>
        </a>
        <span class="utility-divider" aria-hidden="true">/</span>
        <div class="utility-language-control">
          <button class="utility-item utility-language" type="button"
            aria-label="언어 선택, 현재 한국어" aria-haspopup="true"
            aria-expanded="false" aria-controls="language-menu">
            <img src="../header-export/assets/language.png" alt="" width="37" height="37" />
            <span>Langueage</span>
          </button>
          <!-- 번역 기능이 연결되기 전까지 선택한 언어만 헤더에 표시 -->
          <div id="language-menu" class="utility-language-menu" role="group" aria-label="언어 목록" hidden>
            <button type="button" aria-pressed="true">한국어</button>
            <button type="button" aria-pressed="false">English</button>
            <button type="button" aria-pressed="false">中文</button>
            <button type="button" aria-pressed="false">日本語</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- 예매 영역: 위에는 메뉴, 아래에는 역 선택과 조회 조건 -->
      <div class="booking-section">
        <div class="booking-box">
          <div class="booking-menu">
            <span class="placeholder">기차예매 자리</span>
            <span class="placeholder">간편예매 자리</span>
            <span class="placeholder">할인상품 자리</span>
          </div>
          <div class="booking-content">
            <div class="station placeholder">출발역 자리</div>
            <span class="direction placeholder">방향 표시</span>
            <div class="station placeholder">도착역 자리</div>
            <div class="booking-options">
              <div class="trip-menu">
                <span class="placeholder">편도 자리</span>
                <span class="placeholder">왕복 자리</span>
              </div>
              <div class="travel-info">
                <span class="date placeholder">날짜 선택 자리</span>
                <span class="passengers placeholder">인원 자리</span>
              </div>
              <span class="search placeholder">조회 버튼 자리</span>
            </div>
          </div>
        </div>
      </div>

      <div class="main-content">
        <!-- 각 아이콘과 안내 글자가 들어갈 자리 -->
        <div class="quick-menu">
          <div class="quick-item">
            <span class="quick-icon placeholder">아이콘</span
            ><span>승차권 이용안내</span>
          </div>
          <div class="quick-item">
            <span class="quick-icon placeholder">아이콘</span
            ><span>광명역 도심공항터미널</span>
          </div>
          <div class="quick-item">
            <span class="quick-icon placeholder">아이콘</span
            ><span>할인제도</span>
          </div>
          <div class="quick-item">
            <span class="quick-icon placeholder">아이콘</span
            ><span>유실물</span>
          </div>
          <div class="quick-item">
            <span class="quick-icon placeholder">아이콘</span
            ><span>승차권 제휴할인</span>
          </div>
          <div class="quick-item">
            <span class="quick-icon placeholder">아이콘</span
            ><span>열차운임 / 시간표</span>
          </div>
        </div>

        <a href="https://www.korail.com/tour/customer/event/eventProgress/25082" target="_blank" rel="noopener"><img src="../assets/아이콘 외 이미지/배너_KTX-SRT 통합회원 전환 안내.jpg" class="main-banner" alt="KTX-SRT 통합회원 전환 안내 배너" /></a>
        <div class="sub-banners">
          <img src="../assets/아이콘 외 이미지/배너_올바른 열차 이용문화 만들기.png" class="sub-banner" alt="열차 이용문화 안내 배너"></img>
          <img src="../assets/아이콘 외 이미지/배너_간편현금결제.png" class="sub-banner" alt="간편현금결제 안내 배너"></img>
        </div>
      </div>
    </main>

    <!-- href의 ##########을 실제 챗봇 사이트 주소로 바꾸세요. -->
    <a class="chatbot" href="##########" target="_blank" rel="noopener">
      <img src="../assets/아이콘/chatbot icon by dickprayuda.png" alt="" />
      <span>챗봇</span>
    </a>
    <script src="./main.js"></script>
  </body>
</html>
